services:
  - type: web
    name: wasalni-backend
    runtime: node
    runtimeVersion: 22.18.0
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: wasalni-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

databases:
  - name: wasalni-db
    databaseName: wasalni
    user: wasalni-db-user
